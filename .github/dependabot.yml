version: 2
# Package and GitHub Actions update PRs are maintainer/bot-only.
# Keep the 7-day cooldown unless a critical vulnerability requires a
# maintainer-led manual update.
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - 'commit::chore'
      - 'type::automated-pr'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      production_dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development_dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # These docs dependencies share the root workspace lockfile. Disable only
      # version updates for them; security updates remain eligible.
      - dependency-name: '@splidejs/splide'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'chalk'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'vitepress'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'vue'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
    labels:
      - 'commit::chore'
      - 'type::automated-pr'
    cooldown:
      default-days: 7
