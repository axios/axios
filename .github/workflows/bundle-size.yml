name: Bundle Size

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build project
        run: pnpm run build

      - name: Compare bundle size
        uses: axios/bundle-size@6940d767de28b002599d1ab36cc04748de2c49e7 # 0.2.0
        with:
          path: 'packages/axios'
          package-name: axios
          files: |
            dist/axios.js
            dist/axios.min.js
            dist/browser/axios.cjs
            dist/esm/axios.js
            dist/esm/axios.min.js
            dist/node/axios.cjs
          output-file: bundle-size-comparison.json
          # Keep the existing baseline until the first stable v2 release exists.
          release-stream: '1'

      - name: Add bundle size report to summary
        if: always() && hashFiles('packages/axios/bundle-size-comparison.md') != ''
        run: cat packages/axios/bundle-size-comparison.md >> "$GITHUB_STEP_SUMMARY"
