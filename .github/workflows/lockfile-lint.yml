name: Lockfile lint

on:
  pull_request:
    paths:
      - 'package.json'
      - '**/pnpm-lock.yaml'
      - '**/package.json'
      - 'pnpm-workspace.yaml'
      - 'tooling/**'
      - '.github/workflows/lockfile-lint.yml'
  push:
    branches: [v2.x]
    paths:
      - 'package.json'
      - '**/pnpm-lock.yaml'
      - '**/package.json'
      - 'pnpm-workspace.yaml'
      - 'tooling/**'

permissions:
  contents: read

jobs:
  lockfile-lint:
    name: Validate pnpm lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Install isolated lockfile parser
        run: npm install --prefix "$RUNNER_TEMP/axios-lockfile-parser" --ignore-scripts --no-package-lock yaml@2.9.1

      - name: Validate registry hosts and integrity hashes before installing the workspace
        run: AXIOS_LOCKFILE_YAML_MODULE="$RUNNER_TEMP/axios-lockfile-parser/node_modules/yaml/dist/index.js" node tooling/scripts/check-lockfiles.js

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test lockfile validation
        run: pnpm run test:tooling
