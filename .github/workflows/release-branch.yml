name: Create release branch

on:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        description: Choose release type (first v2 release requires major)
        options:
          - patch
          - minor
          - major
        default: patch
      beta:
        type: boolean
        description: Prerelease
        default: false

permissions:
  contents: read

jobs:
  build-and-run-vitest:
    name: Build and run vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build project
        run: pnpm run build

      - name: Validate build artifacts
        run: pnpm run test:build:artifacts

      - name: Install Playwright with deps
        run: pnpm --filter axios exec playwright install --with-deps

      - name: Run unit tests
        run: pnpm run test:vitest:unit

      - name: Run browser tests
        run: pnpm run test:vitest:browser:headless

      - name: Pack npm tarball
        run: pnpm run test:e2e:pack

      - name: Upload npm pack artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axios-tarball
          path: artifacts/e2e/*
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Packaged consumer e2e
    needs: build-and-run-vitest
    uses: ./.github/workflows/e2e.yml

  bump-version-and-create-pr:
    name: Bump version and create PR
    needs: [build-and-run-vitest, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: |
          curl --fail --silent --show-error --location https://registry.npmjs.org/pnpm/-/pnpm-10.34.7.tgz --output "$RUNNER_TEMP/pnpm.tgz"
          printf '%s  %s\n' 'ba98abc585539933375b5971f4bc6d6c73a1b4b7edc4a879e7d102fe5423d1e02309d67c60a11f04955093a96e521ad9c3b138cdd654ca5be563f378b3ae48bd' "$RUNNER_TEMP/pnpm.tgz" | sha512sum --check
          npm install --global "$RUNNER_TEMP/pnpm.tgz" --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Axios version
        env:
          INPUT_TYPE: ${{ github.event.inputs.type }}
          INPUT_BETA: ${{ github.event.inputs.beta }}
        id: bump-version
        run: |
          node --input-type=module <<'CHECK_RELEASE_INPUT'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/axios/package.json', 'utf8'));
          const major = Number(version.split('.')[0]);
          const type = process.env.INPUT_TYPE;
          if (!['patch', 'minor', 'major'].includes(type)) {
            throw new Error('Choose patch, minor, or major for the release type.');
          }
          if (major !== 2 && !(major === 1 && type === 'major')) {
            throw new Error('The v2.x release workflow requires a major bump from v1, or an existing v2 version.');
          }
          CHECK_RELEASE_INPUT
          TYPE="${INPUT_TYPE}"
          if [ "$INPUT_BETA" = "true" ]; then
            TYPE="pre${TYPE}"
          fi
          pnpm run version:axios "$TYPE" --preid=beta --no-git-tag-version --ignore-scripts
          node --input-type=module <<'CHECK_RELEASE_VERSION'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/axios/package.json', 'utf8'));
          if (!version.startsWith('2.')) {
            throw new Error(`The v2.x release workflow cannot prepare ${version}; releases must stay on major 2.`);
          }
          CHECK_RELEASE_VERSION
          pnpm install --lockfile-only --offline --ignore-scripts
          VERSION=$(node -p "require('./packages/axios/package.json').version")
          echo "newTag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "newBranch=release-v2x/version-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare version metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run prepare:version

      - name: Build project
        run: pnpm run build

      - name: Validate build artifacts
        run: pnpm run test:build:artifacts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ steps.bump-version.outputs.newBranch }}
          base: v2.x
          commit-message: 'chore(release): prepare release ${{ steps.bump-version.outputs.newTag }}'
          body: 'This PR prepares the release ${{ steps.bump-version.outputs.newTag }}.'
          title: 'chore(release): prepare release ${{ steps.bump-version.outputs.newTag }}'
          maintainer-can-modify: true
          draft: false
          labels: |
            type::automated-pr
            commit::chore
