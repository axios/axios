name: Create release branch

on:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        description: Choose release type
        options:
          - patch
          - minor
          - major
        default: patch
      beta:
        type: boolean
        description: Prerelease
        default: false

permissions:
  contents: read

jobs:
  build-and-run-vitest:
    name: Build and run vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build project
        run: pnpm run build

      - name: Validate build artifacts
        run: pnpm run test:build:artifacts

      - name: Install Playwright with deps
        run: pnpm --filter axios exec playwright install --with-deps

      - name: Run unit tests
        run: pnpm run test:vitest:unit

      - name: Run browser tests
        run: pnpm run test:vitest:browser:headless

      - name: Pack npm tarball
        run: pnpm run pack:axios

      - name: Upload npm pack artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axios-tarball
          path: artifacts/axios-*.tgz
          if-no-files-found: error
          retention-days: 1

  cjs-smoke-tests:
    name: CJS smoke tests (Node ${{ matrix.node-version }})
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Download npm pack artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axios-tarball
          path: artifacts

      - name: Install CJS smoke test dependencies
        working-directory: tests/compatibility/smoke/cjs
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts

      - name: Install packed axios
        working-directory: tests/compatibility/smoke/cjs
        run: pnpm add --ignore-workspace --ignore-scripts --lockfile=false --save-dev ../../../../artifacts/axios-*.tgz

      - name: Run CJS smoke tests
        working-directory: tests/compatibility/smoke/cjs
        run: pnpm run test:smoke:cjs:mocha

  esm-smoke-tests:
    name: ESM smoke tests (Node ${{ matrix.node-version }})
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Download npm pack artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axios-tarball
          path: artifacts

      - name: Install ESM smoke test dependencies
        working-directory: tests/compatibility/smoke/esm
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts

      - name: Install packed axios
        working-directory: tests/compatibility/smoke/esm
        run: pnpm add --ignore-workspace --ignore-scripts --lockfile=false --save-dev ../../../../artifacts/axios-*.tgz

      - name: Run ESM smoke tests
        working-directory: tests/compatibility/smoke/esm
        run: pnpm run test:smoke:esm:vitest

  cjs-module-tests:
    name: CJS module tests (Node ${{ matrix.node-version }})
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Download npm pack artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axios-tarball
          path: artifacts

      - name: Install CJS module test dependencies
        working-directory: tests/compatibility/module/cjs
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts

      - name: Install packed axios
        working-directory: tests/compatibility/module/cjs
        run: pnpm add --ignore-workspace --ignore-scripts --lockfile=false --save-dev ../../../../artifacts/axios-*.tgz

      - name: Run CJS module tests
        working-directory: tests/compatibility/module/cjs
        run: pnpm run test:module:cjs

  esm-module-tests:
    name: ESM module tests (Node ${{ matrix.node-version }})
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Download npm pack artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axios-tarball
          path: artifacts

      - name: Install ESM module test dependencies
        working-directory: tests/compatibility/module/esm
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts

      - name: Install packed axios
        working-directory: tests/compatibility/module/esm
        run: pnpm add --ignore-workspace --ignore-scripts --lockfile=false --save-dev ../../../../artifacts/axios-*.tgz

      - name: Run ESM module tests
        working-directory: tests/compatibility/module/esm
        run: pnpm run test:module:esm

  bun-smoke-tests:
    name: Bun smoke tests
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Download npm pack artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axios-tarball
          path: artifacts

      - name: Install packed axios
        env:
          TMPDIR: ${{ runner.temp }}
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        run: |
          mkdir -p "$BUN_INSTALL_CACHE_DIR"
          mv artifacts/axios-*.tgz artifacts/axios.tgz
          cd tests/compatibility/smoke/bun
          bun add file:../../../../artifacts/axios.tgz

      - name: Run Bun smoke tests
        working-directory: tests/compatibility/smoke/bun
        run: bun test

  deno-smoke-tests:
    name: Deno smoke tests
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          cache: false

      - name: Download npm pack artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axios-tarball
          path: artifacts

      - name: Prepare packed axios dist
        run: tar -xzf artifacts/axios-*.tgz -C artifacts

      - name: Install Deno smoke test dependencies
        working-directory: tests/compatibility/smoke/deno
        run: deno install

      - name: Run Deno smoke tests
        working-directory: tests/compatibility/smoke/deno
        run: deno task test

  bump-version-and-create-pr:
    name: Bump version and create PR
    needs:
      [
        build-and-run-vitest,
        cjs-smoke-tests,
        esm-smoke-tests,
        cjs-module-tests,
        esm-module-tests,
        bun-smoke-tests,
        deno-smoke-tests,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Axios version
        env:
          INPUT_TYPE: ${{ github.event.inputs.type }}
          INPUT_BETA: ${{ github.event.inputs.beta }}
        id: bump-version
        run: |
          TYPE="${INPUT_TYPE}"
          if [ "$INPUT_BETA" = "true" ]; then
            TYPE="pre${TYPE}"
          fi
          pnpm run version:axios "$TYPE" --preid=beta --no-git-tag-version --ignore-scripts
          pnpm install --lockfile-only --offline --ignore-scripts
          VERSION=$(node -p "require('./packages/axios/package.json').version")
          echo "newTag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "newBranch=release-v2x/version-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare version metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run prepare:version

      - name: Build project
        run: pnpm run build

      - name: Validate build artifacts
        run: pnpm run test:build:artifacts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ steps.bump-version.outputs.newBranch }}
          base: v2.x
          commit-message: 'chore(release): prepare release ${{ steps.bump-version.outputs.newTag }}'
          body: 'This PR prepares the release ${{ steps.bump-version.outputs.newTag }}.'
          title: 'chore(release): prepare release ${{ steps.bump-version.outputs.newTag }}'
          maintainer-can-modify: true
          draft: false
          labels: |
            type::automated-pr
            commit::chore
