name: Continuous integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-run-vitest:
    name: Build and run vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Build project
        run: pnpm run build

      - name: Validate build artifacts
        run: pnpm run test:build:artifacts

      - name: Install Playwright with deps
        run: pnpm --filter axios exec playwright install --with-deps

      - name: Run unit tests
        run: pnpm run test:vitest:unit

      - name: Run browser tests
        run: pnpm run test:vitest:browser:headless

      - name: Pack npm tarball
        run: pnpm run pack:axios

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Upload npm pack artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axios-tarball
          path: artifacts/axios-*.tgz
          if-no-files-found: error
          retention-days: 1

  cjs-smoke-tests:
    name: CJS smoke tests (Node ${{ matrix.node-version }})
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Download npm pack artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axios-tarball
          path: artifacts

      - name: Install CJS smoke test dependencies
        working-directory: tests/compatibility/smoke/cjs
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts

      - name: Install packed axios
        working-directory: tests/compatibility/smoke/cjs
        run: pnpm add --ignore-workspace --ignore-scripts --lockfile=false --save-dev ../../../../artifacts/axios-*.tgz

      - name: Run CJS smoke tests
        working-directory: tests/compatibility/smoke/cjs
        run: pnpm run test:smoke:cjs:mocha

  esm-smoke-tests:
    name: ESM smoke tests (Node ${{ matrix.node-version }})
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Download npm pack artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axios-tarball
          path: artifacts

      - name: Install ESM smoke test dependencies
        working-directory: tests/compatibility/smoke/esm
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts

      - name: Install packed axios
        working-directory: tests/compatibility/smoke/esm
        run: pnpm add --ignore-workspace --ignore-scripts --lockfile=false --save-dev ../../../../artifacts/axios-*.tgz

      - name: Run ESM smoke tests
        working-directory: tests/compatibility/smoke/esm
        run: pnpm run test:smoke:esm:vitest

  cjs-module-tests:
    name: CJS module tests (Node ${{ matrix.node-version }})
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Download npm pack artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axios-tarball
          path: artifacts

      - name: Install CJS module test dependencies
        working-directory: tests/compatibility/module/cjs
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts

      - name: Install packed axios
        working-directory: tests/compatibility/module/cjs
        run: pnpm add --ignore-workspace --ignore-scripts --lockfile=false --save-dev ../../../../artifacts/axios-*.tgz

      - name: Run CJS module tests
        working-directory: tests/compatibility/module/cjs
        run: pnpm run test:module:cjs

  esm-module-tests:
    name: ESM module tests (Node ${{ matrix.node-version }})
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Download npm pack artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axios-tarball
          path: artifacts

      - name: Install ESM module test dependencies
        working-directory: tests/compatibility/module/esm
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts

      - name: Install packed axios
        working-directory: tests/compatibility/module/esm
        run: pnpm add --ignore-workspace --ignore-scripts --lockfile=false --save-dev ../../../../artifacts/axios-*.tgz

      - name: Run ESM module tests
        working-directory: tests/compatibility/module/esm
        run: pnpm run test:module:esm

  bun-smoke-tests:
    name: Bun smoke tests
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Download npm pack artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axios-tarball
          path: artifacts

      - name: Install packed axios
        env:
          TMPDIR: ${{ runner.temp }}
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        run: |
          mkdir -p "$BUN_INSTALL_CACHE_DIR"
          mv artifacts/axios-*.tgz artifacts/axios.tgz
          cd tests/compatibility/smoke/bun
          bun add file:../../../../artifacts/axios.tgz

      - name: Run Bun smoke tests
        working-directory: tests/compatibility/smoke/bun
        run: bun test

  deno-smoke-tests:
    name: Deno smoke tests
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          cache: false

      - name: Download npm pack artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axios-tarball
          path: artifacts

      - name: Prepare packed axios dist
        run: tar -xzf artifacts/axios-*.tgz -C artifacts

      - name: Install Deno smoke test dependencies
        working-directory: tests/compatibility/smoke/deno
        run: deno install

      - name: Run Deno smoke tests
        working-directory: tests/compatibility/smoke/deno
        run: deno task test
