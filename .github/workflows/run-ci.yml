name: Continuous integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-run-vitest:
    name: Build and run vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.7 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Build project
        run: pnpm run build

      - name: Validate build artifacts
        run: pnpm run test:build:artifacts

      - name: Install Playwright with deps
        run: pnpm --filter axios exec playwright install --with-deps

      - name: Run unit tests
        run: pnpm run test:vitest:unit

      - name: Run browser tests
        run: pnpm run test:vitest:browser:headless

      - name: Pack npm tarball
        run: pnpm run test:e2e:pack

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Upload npm pack artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axios-tarball
          path: artifacts/e2e/*
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Packaged consumer e2e
    needs: build-and-run-vitest
    uses: $/.github/workflows/e2e.yml
